name: 每日机场

# 北京时间每天 06:00 挑一座「今天天气最好、最值得飞」的机场。
# GitHub 的 cron 用 UTC：22:00 UTC = 次日 06:00 北京。

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  today:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 按天气挑今日三座
        run: node scripts/build-today.mjs

      - name: 给三座配图（Wikimedia 优先，主题图兜底）
        run: node scripts/build-picks-photos.mjs

      - name: 清理 30 天前的配图
        run: |
          cd images/picks 2>/dev/null || exit 0
          ls -1d 20* 2>/dev/null | sort | head -n -30 | xargs -r rm -rf
          echo "保留最近 30 天：$(ls -1d 20* 2>/dev/null | wc -l) 个目录"

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/today-auto.js images/picks
          if git diff --staged --quiet; then
            echo "今日机场没有变化，跳过提交"
          else
            git commit -m "chore: 更新今日机场 $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase --autostash origin main
            git push
          fi
