name: update-scenery

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00，每天更新一次地景索引
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取 SceneryAddons 的 MSFS 2024 机场地景
        run: node scripts/fetch-scenery.mjs --pages=3

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/scenery-auto.js
          if git diff --staged --quiet; then
            echo "没有新条目，跳过提交"
          else
            git commit -m "chore: update scenery index"
            git push
          fi
