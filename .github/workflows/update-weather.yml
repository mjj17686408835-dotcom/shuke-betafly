name: 机场天气快照

# 北京时间每天 08:00 抓一次机场实况（METAR），供卡片和搜索结果展示。
# GitHub 的 cron 用 UTC：00:00 UTC = 08:00 北京。

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓 METAR 生成天气快照
        run: node scripts/build-weather.mjs

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/weather-auto.js
          if git diff --staged --quiet; then
            echo "天气没有变化，跳过提交"
          else
            git commit -m "chore: 更新机场天气 $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
